name: google_maps_flutter
description: A Flutter plugin for integrating Google Maps in iOS and Android applications.
publish_to: none
repository: https://github.com/flutter/plugins/tree/main/packages/google_maps_flutter/google_maps_flutter
issue_tracker: https://github.com/flutter/flutter/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+maps%22
version: 2.1.8

environment:
  sdk: ">=2.17.5 <3.0.0"
  flutter: ">=2.8.0"

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.googlemaps
        pluginClass: GoogleMapsPlugin
      ios:
        pluginClass: FLTGoogleMapsPlugin
      web:
        default_package: google_maps_flutter_web

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.1
  google_maps_flutter_platform_interface: #^2.2.0
#    path: ../google_maps_flutter_platform_interface
    git:
      url: https://github.com/vkbaloda/google_maps_flutter.git
      path: google_maps_flutter_platform_interface
      ref: web_overlay
  google_maps_flutter_web:
#    path: ../google_maps_flutter_web
    git:
      url: https://github.com/vkbaloda/google_maps_flutter.git
      path: google_maps_flutter_web
      ref: web_overlay

dev_dependencies:
  flutter_test:
    sdk: flutter

  pedantic: ^1.10.0
  plugin_platform_interface: ^2.0.0
  stream_transform: ^2.0.0
